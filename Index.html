<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Défi HTML Simple</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .challenge { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; }
        .hidden { display: none; }
        #success { color: green; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Défi HTML : Trouver l'ID caché</h1>
    
    <div class="challenge">
        <p>Insérez le code suivant dans votre navigateur (F12 > Console) :</p>
        <pre>document.getElementById('secret').innerText</pre>
        <input type="text" id="answer" placeholder="Entrez la réponse ici">
        <button onclick="checkAnswer()">Vérifier</button>
        <div id="success" class="hidden">Bravo ! Accès au niveau suivant.</div>
    </div>

    <script>
        function checkAnswer() {
            // Note: En production, la vérification doit se faire côté serveur
            const answer = document.getElementById('answer').value;
            if (answer === "Le secret est 1234") {
                document.getElementById('success').classList.remove('hidden');
            } else {
                alert("Réponse incorrecte.");
            }
        }
    </script>

    <!-- Élément caché pour le défi -->
    <div id="secret" class="hidden">Le secret est 1234</div>

</body>
</html>
